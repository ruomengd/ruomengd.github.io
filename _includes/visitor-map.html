{% if site.visitor_map_id %}
{% assign citation_map = site.static_files | where: "path", "/assets/maps/citations.html" | first %}
<div class="visitor-map" data-visitor-map-id="{{ site.visitor_map_id }}">
  <div class="map-tabs" role="tablist" aria-label="World maps">
    <button type="button" id="visitors-tab" class="map-tab" role="tab" aria-selected="true" aria-controls="visitors-panel">Visitors</button>
    <button type="button" id="citations-tab" class="map-tab" role="tab" aria-selected="false" aria-controls="citations-panel" tabindex="-1">Citations</button>
  </div>
  <div id="visitors-panel" class="map-panel" role="tabpanel" tabindex="0" aria-labelledby="visitors-tab">
    <div class="map-canvas"><div class="visitor-map-widget" aria-label="Visitor locations on a world map"></div></div>
    <p class="visitor-map-status" hidden>
      Visitor map is temporarily unavailable.
      <button type="button" class="visitor-map-retry">Retry</button>
    </p>
  </div>
  <div id="citations-panel" class="map-panel" role="tabpanel" tabindex="0" aria-labelledby="citations-tab" hidden>
    {% if citation_map %}
    <div class="map-canvas"><iframe class="citation-map-frame" data-src="{{ '/assets/maps/citations.html' | relative_url }}?v={{ site.time | date: '%s' }}" title="Institutions of researchers citing my work" sandbox="allow-scripts allow-same-origin allow-popups" referrerpolicy="no-referrer"></iframe></div>
    {% else %}
    <p class="map-empty">Citation map is being prepared.</p>
    {% endif %}
  </div>
</div>
{% endif %}
